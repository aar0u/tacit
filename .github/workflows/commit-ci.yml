name: Build debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CI_NAME: Build debug APK
  BUILD_ABI: arm64-v8a

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 25
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools cmake;4.1.2'

      - name: Calculate JNI cache hash
        id: cache-hash
        run: ./gradlew :app:calculateNativeCacheHash

      - name: Fetch JNI cache
        uses: actions/cache@v6
        id: jni-cache
        with:
          path: "app/prebuilt"
          key: ${{ runner.os }}-tacit-jni-debug-${{ steps.cache-hash.outputs.native-cache-hash }}

      - name: Build debug APK
        run: make debug

      - name: Add JNI cache
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        run: cp -R app/build/intermediates/merged_native_libs/debug/mergeDebugNativeLibs/out/lib app/prebuilt

      - name: Fetch speech models
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet onnxruntime
          "$RUNNER_TEMP/venv/bin/python" script/fetch_voice_models.py

      - name: Build voice APK
        run: ./gradlew :voice:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: tacit-debug-arm64-v8a
          path: |
            app/build/outputs/apk/debug/*arm64-v8a*.apk
            voice/build/outputs/apk/debug/voice-debug.apk
          retention-days: 30

      - name: Replace ci-latest release
        continue-on-error: true
        run: gh release delete --yes --cleanup-tag ci-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish ci-latest release
        uses: softprops/action-gh-release@v3
        with:
          name: "CI debug build"
          tag_name: ci-latest
          prerelease: true
          files: |
            app/build/outputs/apk/debug/*arm64-v8a*.apk
            voice/build/outputs/apk/debug/voice-debug.apk
