preset_keys:
  VOICE_ASSIST: {label: 语音, send: VOICE_ASSIST}
  Hide: {label: 隐藏, send: BACK}
  BackSpace: {label: 退格, repeatable: true, send: BackSpace}
  select_all: {label: 全选, send: Control+a}
  cut: {label: 剪切, send: Control+x}
  copy: {label: 复制, send: Control+c}
  paste: {label: 粘贴, send: Control+v}
  CommitComment: {label: 编码, send: Control+Shift+Return}
  Mode_switch: {toggle: ascii_mode, send: SWITCH_CHARSET, states: [ 中文, 英文 ]}
  Keyboard_symbols: {label: 符号, send: Eisu_toggle, select: symbols}
  Keyboard_number: {label: 数字, send: Eisu_toggle, select: number}
  Menu: {label: 方案, send: MENU}
  Date: {label: 日期, command: date, option: "yyyy-MM-dd"}
  Time: {label: 时间, command: date, option: "HH:mm:ss"}

# The keyboard Trime picks for a schema is the preset keyboard named after the
# schema id, so this layout is what rime_ice shows. The base theme only provides
# the 40-key "default" layout for it, which has no room for the voice key.
preset_keyboards:
  rime_ice:
    name: Tacit 26键
    ascii_mode: 0
    columns: 10
    width: 10
    height: 56
    lock: true
    key_press_offset_x: 2
    key_press_offset_y: 2
    keys:
    - {click: 'q', long_click: '!', swipe_up: 1}
    - {click: 'w', long_click: '@', swipe_up: 2}
    - {click: 'e', long_click: '#', swipe_up: 3}
    - {click: 'r', long_click: '$', swipe_up: 4}
    - {click: 't', long_click: '%', swipe_up: 5}
    - {click: 'y', long_click: '^', swipe_up: 6}
    - {click: 'u', long_click: '&', swipe_up: 7}
    - {click: 'i', long_click: '*', swipe_up: 8}
    - {click: 'o', long_click: '(', swipe_up: 9}
    - {click: 'p', long_click: 'Hide', swipe_up: 0}
    - {width: 5}
    - {click: 'a', long_click: select_all, swipe_left: Left, swipe_right: Right, swipe_up: Up, swipe_down: Down}
    - {click: 's', long_click: '~', swipe_left: Home, swipe_right: End, swipe_up: Page_Up, swipe_down: Page_Down}
    - {click: 'd', long_click: '-', swipe_down: '_'}
    - {click: 'f', long_click: '+', swipe_down: '='}
    - {click: 'g', long_click: '\', swipe_down: '|'}
    - {click: 'h', long_click: '[', swipe_left: '[', swipe_right: ']'}
    - {click: 'j', long_click: '{', swipe_left: '{', swipe_right: '}'}
    - {click: 'k', long_click: ':'}
    - {click: 'l', long_click: ';'}
    - {width: 5}
    - {click: Shift_L, send_bindings: false, width: 15, key_back_color: func_key_back_color, key_text_color: func_key_text_color, hilited_key_back_color: func_key_hilited_color}
    - {click: 'z', long_click: '`'}
    - {click: 'x', long_click: cut}
    - {click: 'c', long_click: copy}
    - {click: 'v', long_click: paste}
    - {click: 'b', long_click: Time, swipe_up: Date}
    - {click: 'n', long_click: '"'}
    - {click: 'm', long_click: "'"}
    - {click: BackSpace, swipe_left: Escape, width: 15, key_back_color: func_key_back_color, key_text_color: func_key_text_color, hilited_key_back_color: func_key_hilited_color}
    - {click: Mode_switch, long_click: Menu, width: 15, key_back_color: func_key_back_color, key_text_color: func_key_text_color, hilited_key_back_color: func_key_hilited_color}
    - {click: Keyboard_symbols, long_click: Keyboard_number, key_back_color: func_key_back_color, key_text_color: func_key_text_color, hilited_key_back_color: func_key_hilited_color}
    - {click: ',', long_click: '<'}
    - {click: space, width: 30}
    - {click: '.', long_click: '>'}
    - {click: VOICE_ASSIST, long_click: '/', swipe_up: '?', key_back_color: func_key_back_color, key_text_color: func_key_text_color, hilited_key_back_color: func_key_hilited_color}
    - {click: Return, composing: Return1, long_click: CommitComment, width: 15, key_back_color: enter_key_back_color, key_text_color: enter_key_text_color}
