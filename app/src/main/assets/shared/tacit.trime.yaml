# Tacit theme: rounded white keys, tinted function keys, simplified labels.
# It extends the upstream default theme, so only differences are listed here.
# encoding: utf-8

config_version: "3.0"
name: Tacit
author: Tacit

__include: trime:/

style:
  round_corner: 12
  horizontal_gap: 5
  vertical_gap: 9
  key_text_size: 24
  symbol_text_size: 11
  candidate_text_size: 22
  candidate_view_height: 40
  comment_text_size: 12
  keyboard_height: 280
  enter_labels:
    go: 前往
    done: 完成
    next: 下一项
    pre: 上一项
    search: 搜索
    send: 发送
    default: 换行

preset_color_schemes:
  default:
    name: Tacit 浅色
    author: Tacit
    dark_scheme: tacit_dark
    back_color: 0xe2e4ea
    border_color: 0xc9cbd3
    candidate_separator_color: 0xe2e4ea
    candidate_text_color: 0x1b1b1f
    comment_text_color: 0x6b6b76
    hilited_back_color: 0xe8def8
    hilited_candidate_back_color: 0xe8def8
    hilited_candidate_text_color: 0x1d1b20
    hilited_comment_text_color: 0x4a3b87
    hilited_key_back_color: 0xd0bcff
    hilited_key_symbol_color: 0x4a3b87
    hilited_key_text_color: 0x1d1b20
    hilited_off_key_back_color: 0xd0bcff
    hilited_off_key_text_color: 0x1d1b20
    hilited_on_key_back_color: 0xd0bcff
    hilited_on_key_text_color: 0x1d1b20
    hilited_text_color: 0x6750a4
    key_back_color: 0xffffff
    key_symbol_color: 0x6b6b76
    key_text_color: 0x1b1b1f
    keyboard_back_color: 0xe2e4ea
    label_color: 0x6b6b76
    off_key_back_color: 0xffffff
    off_key_text_color: 0x1b1b1f
    on_key_back_color: 0xe8def8
    on_key_text_color: 0x4a3b87
    preview_back_color: 0xffffff
    preview_text_color: 0x1b1b1f
    shadow_color: 0x00000000
    text_color: 0x6750a4
    text_back_color: 0xf3edff
    func_key_back_color: 0xe8def8
    func_key_text_color: 0x4a3b87
    func_key_hilited_color: 0xd0bcff

  tacit_dark:
    name: Tacit 深色
    author: Tacit
    light_scheme: default
    back_color: 0x1e1a3a
    border_color: 0x39345c
    candidate_separator_color: 0x1e1a3a
    candidate_text_color: 0xf2eff7
    comment_text_color: 0xc9c5d6
    hilited_back_color: 0x4a4570
    hilited_candidate_back_color: 0x4a4570
    hilited_candidate_text_color: 0xffffff
    hilited_comment_text_color: 0xe8def8
    hilited_key_back_color: 0x8a86a0
    hilited_key_symbol_color: 0xffffff
    hilited_key_text_color: 0xffffff
    hilited_off_key_back_color: 0x8a86a0
    hilited_off_key_text_color: 0xffffff
    hilited_on_key_back_color: 0x8a86a0
    hilited_on_key_text_color: 0xffffff
    hilited_text_color: 0xd0bcff
    key_back_color: 0x6f6d80
    key_symbol_color: 0xc9c5d6
    key_text_color: 0xf2eff7
    keyboard_back_color: 0x1e1a3a
    label_color: 0xc9c5d6
    off_key_back_color: 0x6f6d80
    off_key_text_color: 0xf2eff7
    on_key_back_color: 0x6750a4
    on_key_text_color: 0xffffff
    preview_back_color: 0x6f6d80
    preview_text_color: 0xffffff
    shadow_color: 0x00000000
    text_color: 0xd0bcff
    text_back_color: 0x2b2650
    func_key_back_color: 0x6750a4
    func_key_text_color: 0xffffff
    func_key_hilited_color: 0x7d67bd

preset_keys:
  Hide: {label: 隐藏, send: BACK}
  BackSpace: {label: 退格, repeatable: true, send: BackSpace}
  select_all: {label: 全选, send: Control+a}
  cut: {label: 剪切, send: Control+x}
  copy: {label: 复制, send: Control+c}
  paste: {label: 粘贴, send: Control+v}
  CommitComment: {label: 编码, send: Control+Shift+Return}
  Mode_switch: {toggle: ascii_mode, send: SWITCH_CHARSET, states: [ 中文, 英文 ]}
  Keyboard_symbols: {label: 符号, send: Eisu_toggle, select: symbols}
  Menu: {label: 方案, send: MENU}
  Date: {label: 日期, command: date, option: "yyyy-MM-dd"}
  Time: {label: 时间, command: date, option: "HH:mm:ss"}

preset_keyboards:
  qwerty:
    name: Tacit 26键
    height: 56
    keys:
    - {click: 'q', long_click: '!', swipe_up: 1}
    - {click: 'w', long_click: '@', swipe_up: 2}
    - {click: 'e', long_click: '#', swipe_up: 3}
    - {click: 'r', long_click: '$', swipe_up: 4}
    - {click: 't', long_click: '%', swipe_up: 5}
    - {click: 'y', long_click: '^', swipe_up: 6}
    - {click: 'u', long_click: '&', swipe_up: 7}
    - {click: 'i', long_click: '*', swipe_up: 8}
    - {click: 'o', long_click: '(){Left}', swipe_up: 9}
    - {click: 'p', long_click: 'Hide', swipe_up: 0}
    - {width: 5}
    - {click: 'a', long_click: select_all, swipe_left: Left, swipe_right: Right, swipe_up: Up, swipe_down: Down}
    - {click: 's', long_click: '~', swipe_left: Home, swipe_right: End, swipe_up: Page_Up, swipe_down: Page_Down}
    - {click: 'd', long_click: '-', swipe_down: '_'}
    - {click: 'f', long_click: '+', swipe_down: '='}
    - {click: 'g', long_click: '\', swipe_down: '|'}
    - {click: 'h', long_click: '[]{Left}', swipe_left: '[', swipe_right: ']'}
    - {click: 'j', long_click: '{}{Left}', swipe_left: '{', swipe_right: '}'}
    - {click: 'k', long_click: ':'}
    - {click: 'l', long_click: ';'}
    - {width: 5}
    - {click: Shift_L, send_bindings: false, width: 15, key_back_color: func_key_back_color, key_text_color: func_key_text_color, hilited_key_back_color: func_key_hilited_color}
    - {click: 'z', long_click: '`'}
    - {click: 'x', long_click: cut}
    - {click: 'c', long_click: copy}
    - {click: 'v', long_click: paste}
    - {click: 'b', long_click: Time, swipe_up: Date}
    - {click: 'n', long_click: '"'}
    - {click: 'm', long_click: "'"}
    - {click: BackSpace, swipe_left: Escape, width: 15, key_back_color: func_key_back_color, key_text_color: func_key_text_color, hilited_key_back_color: func_key_hilited_color}
    - {click: Mode_switch, long_click: Menu, width: 15, key_back_color: func_key_back_color, key_text_color: func_key_text_color, hilited_key_back_color: func_key_hilited_color}
    - {click: Keyboard_symbols, long_click: Keyboard_number, key_back_color: func_key_back_color, key_text_color: func_key_text_color, hilited_key_back_color: func_key_hilited_color}
    - {click: ',', long_click: '<'}
    - {click: space, width: 30}
    - {click: '.', long_click: '>'}
    - {click: '/', long_click: '?'}
    - {click: Return, composing: Return1, long_click: CommitComment, width: 15, key_back_color: func_key_back_color, key_text_color: func_key_text_color, hilited_key_back_color: func_key_hilited_color}
