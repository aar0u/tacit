# Tacit's only theme: rounded keys and tinted function keys, with the colour
# palettes of CyIME (lavender, blue, black, mint, sakura, cream, each with a dark
# variant that follows the system setting). It extends the upstream theme, so only
# the differences are listed here. Colour schemes written by upstream are hidden:
# ThemeLoader keeps only those whose author is "Tacit".
# encoding: utf-8

config_version: "3.0"
name: Tacit
author: Tacit

__include: trime:/

style:
  round_corner: 12
  horizontal_gap: 5
  vertical_gap: 9
  key_text_size: 24
  key_long_text_size: 16
  symbol_text_size: 11
  candidate_text_size: 22
  candidate_view_height: 40
  comment_text_size: 12
  keyboard_height: 280
  enter_labels:
    go: 前往
    done: 完成
    next: 下一项
    pre: 上一项
    search: 搜索
    send: 发送
    default: 换行

# A key that is switched on (the voice key and the space bar while recording) uses the
# enter key colors.
fallback_colors:
  on_key_back_color: enter_key_back_color
  on_key_text_color: enter_key_text_color

