# The "more" panel (symbols, emoji, lists). Its bar draws labels as plain text, so it
# uses glyph keys, not the icon-font ones of the main keyboard.
liquid_keyboard:
  fixed_key_bar:
    keys: [liquid_keyboard_exit, space1, BackSpace_text, Return_text, clipboard_window, liquid_keyboard_switch]

# The bar above the keys: menu, hide, emoji, clipboard history, cursor and selection
# keys, voice and the Chinese/English switch. Icons come from the bundled icon font.
tool_bar:
  button_spacing: 6
  button_font: iconfont.ttf
  back_style: "ic@arrow-left"
  primary_button:
    background:
      type: circle
      normal: 0x00
      highlight: hilited_candidate_back_color
      vertical_inset: 4
      horizontal_inset: 4
    foreground:
      style: "ic@view_grid"
      normal: candidate_text_color
      padding: 10
    action: menu_keyboard
    long_press_action: Settings
  buttons:
    - foreground: {style: "ic@chevron_down", normal: candidate_text_color}
      action: Hide
    - foreground: {style: "ic@emoticon_outline", normal: candidate_text_color}
      action: liquid_keyboard_emoji
    - foreground: {style: "ic@clipboard_text_outline", normal: candidate_text_color}
      action: clipboard_window
    - foreground: {style: "ic@cursor_text", normal: candidate_text_color}
      action: Keyboard_editor
  # No voice or 中/En button here: the bottom row of the keyboard already has both.

preset_keys:
  BackSpace_text: {label: 退格, repeatable: true, send: BackSpace}
  Return_text: {label: 回车, send: Return}
  # Only the difference from the upstream key.
  liquid_keyboard_switch: {functional: true}
  # The toolbar's first button names this key; without it the button typed its own name.
  menu_keyboard: {label: 菜单, send: FUNCTION, command: menu_keyboard}
  # Keys of the editor keyboard (cursor movement, selection, clipboard operations).
  Keyboard_editor: {label: 编辑, functional: false, send: Eisu_toggle, select: editor}
  space1: {label: 空格, repeatable: false, functional: true, send: space}
  Left: {label: '←', send: Left, repeatable: true, functional: false}
  Right: {label: '→', send: Right, repeatable: true, functional: false}
  Up: {label: '↑', send: Up, repeatable: true, functional: false}
  Down: {label: '↓', send: Down, repeatable: true, functional: false}
  Left1: {label: '⇦', send: Control+Left, repeatable: true, functional: false}
  Right1: {label: '⇨', send: Control+Right, repeatable: true, functional: false}
  Home: {label: 行首, send: Home}
  End: {label: 行尾, send: End}
  Shift_L2: {label: 选择, preview: '⇪', functional: true, send: Shift_L}
  Tab1: {label: Tab, functional: false, send: Tab}
  undo: {label: 撤销, send: Control+z}
  redo: {label: 重做, send: Control+Shift+z}
  # _voice_input is not a Rime option: KeyAction reads it from VoiceDictation, which also
  # lights these keys up while recording (Key.appearanceType).
  VOICE_ASSIST: {toggle: _voice_input, send: VOICE_ASSIST, functional: true, states: [ "ic@microphone_outline", "ic@microphone" ]}
  # Long press on the space bar: record while held.
  VOICE_HOLD: {label: 按住说话, send: VOICE_ASSIST, option: hold}
  space: {toggle: _voice_input, send: space, repeatable: false, functional: false, states: [ ' ', "ic@microphone" ]}
  # Functional keys take the off_key_* colors of the color scheme.
  Shift_L: {label: "ic@arrow_up_bold_outline", send: Shift_L, shift_lock: ascii_long, functional: true}
  Return: {label: "ic@keyboard_return", send: Return}
  Return1: {label: "ic@keyboard_return", send: Return}
  Hide: {label: 隐藏, send: BACK}
  BackSpace: {label: "ic@backspace_outline", repeatable: true, send: BackSpace, functional: true}
  Clear: {label: 清空, text: "{Control+a}{BackSpace}"}
  Delete: {label: 删除, send: Delete}
  select_all: {label: 全选, send: Control+a}
  cut: {label: 剪切, send: Control+x}
  copy: {label: 复制, send: Control+c}
  paste: {label: 粘贴, send: Control+v}
  CommitComment: {label: 编码, send: Control+Shift+Return}
  Mode_switch: {toggle: ascii_mode, send: SWITCH_CHARSET, functional: true, states: [ 中, EN ]}
  Keyboard_symbols: {label: '!@#', send: Eisu_toggle, select: symbols, functional: true}
  Keyboard_number: {label: '123', send: Eisu_toggle, select: number, functional: true}
  Keyboard_default: {label: 返回, send: Eisu_toggle, select: .default, functional: true}
  Menu: {label: 方案, send: MENU}
  Date: {label: 日期, command: date, option: "yyyy-MM-dd"}
  Time: {label: 时间, command: date, option: "HH:mm:ss"}

# The keyboard Trime picks for a schema is the preset keyboard named after the
# schema id, so this layout is what rime_ice shows. The base theme only provides
# the 40-key "default" layout for it, which has no room for the voice key.
preset_keyboards:
  rime_ice:
    name: Tacit 26键
    ascii_mode: 0
    columns: 10
    width: 10
    height: 56
    lock: true
    key_press_offset_x: 2
    key_press_offset_y: 2
    keys:
    - {click: 'q', long_click: '!', swipe_up: 1}
    - {click: 'w', long_click: '@', swipe_up: 2}
    - {click: 'e', long_click: '#', swipe_up: 3}
    - {click: 'r', long_click: '$', swipe_up: 4}
    - {click: 't', long_click: '%', swipe_up: 5}
    - {click: 'y', long_click: '^', swipe_up: 6}
    - {click: 'u', long_click: '&', swipe_up: 7}
    - {click: 'i', long_click: '*', swipe_up: 8}
    - {click: 'o', long_click: '(', swipe_up: 9}
    - {click: 'p', long_click: 'Hide', swipe_up: 0}
    - {width: 5}
    - {click: 'a', long_click: select_all, swipe_left: Left, swipe_right: Right, swipe_up: Up, swipe_down: Down}
    - {click: 's', long_click: '~', swipe_left: Home, swipe_right: End, swipe_up: Page_Up, swipe_down: Page_Down}
    - {click: 'd', long_click: '-', swipe_down: '_'}
    - {click: 'f', long_click: '+', swipe_down: '='}
    - {click: 'g', long_click: '\', swipe_down: '|'}
    - {click: 'h', long_click: '[', swipe_left: '[', swipe_right: ']'}
    - {click: 'j', long_click: '{', swipe_left: '{', swipe_right: '}'}
    - {click: 'k', long_click: ':'}
    - {click: 'l', long_click: ';'}
    - {width: 5}
    - {click: Shift_L, send_bindings: false, width: 15}
    - {click: 'z', long_click: '`'}
    - {click: 'x', long_click: cut}
    - {click: 'c', long_click: copy}
    - {click: 'v', long_click: paste}
    - {click: 'b', long_click: Time, swipe_up: Date}
    - {click: 'n', long_click: '"'}
    - {click: 'm', long_click: "'"}
    - {click: BackSpace, long_click: Clear, swipe_left: Escape, width: 15}
    - {click: Keyboard_symbols, width: 9}
    - {click: Keyboard_number, width: 9}
    - {click: ',', long_click: '<', width: 9}
    - {click: space, long_click: VOICE_HOLD, width: 28}
    - {click: '.', long_click: '>', width: 9}
    - {click: VOICE_ASSIST, long_click: '/', swipe_up: '?', width: 10}
    - {click: Mode_switch, long_click: Menu, width: 11}
    - {click: Return, composing: Return1, width: 15, key_back_color: enter_key_back_color, key_text_color: enter_key_text_color}
  # Until rime_ice has been deployed (about three minutes after a fresh install) the
  # active schema is another one, and Trime then falls back to these layouts. Tacit has
  # only the one letter layout, so all of them are the same.
  default:
    __include: /preset_keyboards/rime_ice
  qwerty:
    __include: /preset_keyboards/rime_ice
  qwerty_:
    __include: /preset_keyboards/rime_ice
  qwerty0:
    __include: /preset_keyboards/rime_ice
  editor:
    name: 编辑
    ascii_mode: 1
    width: 20
    height: 62
    keys:
    - {click: select_all}
    - {click: Left1}
    - {click: Up}
    - {click: Right1}
    - {click: BackSpace}
    - {click: cut}
    - {click: Left}
    - {click: Shift_L2}
    - {click: Right}
    - {click: space1}
    - {click: copy}
    - {click: Home}
    - {click: Down}
    - {click: End}
    - {click: Return, key_back_color: enter_key_back_color, key_text_color: enter_key_text_color}
    - {click: paste}
    - {click: undo}
    - {click: Tab1}
    - {click: redo}
    - {click: Keyboard_default}
  # Same as the base symbols layout, without the key that opened the theme list, and with
  # Simplified labels (via the preset keys above).
  symbols:
    name: 符号
    ascii_mode: 1
    width: 10
    height: 56
    keys:
    - {click: '1'}
    - {click: '2'}
    - {click: '3'}
    - {click: '4'}
    - {click: '5'}
    - {click: '6'}
    - {click: '7'}
    - {click: '8'}
    - {click: '9'}
    - {click: '0'}
    - {click: '~',long_click: '`'}
    - {click: '!'}
    - {click: '@'}
    - {click: '#'}
    - {click: '$'}
    - {click: '￥'}
    - {click: '%'}
    - {click: '^'}
    - {click: '&'}
    - {click: '*'}
    - {click: '(', long_click: '{'}
    - {click: ')', long_click: '}'}
    - {click: '[', long_click: '【'}
    - {click: ']', long_click: '】'}
